<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rono – ready to run</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
a{color:#C8F031}a:hover{color:#E2FF7A}
</style>
</helmet>
<div style="width: 412px; height: 915px; box-sizing: border-box; background: #0E0F11; color: #F4F5F2; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <div style="padding: 28px 20px 16px; display: flex; justify-content: space-between; align-items: center">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; color: {{accent}}">Rono</span>
      <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 600; letter-spacing: -0.01em">Ready to run</h1>
    </div>
    <button aria-label="Settings" style="width: 48px; height: 48px; border-radius: 999px; border: none; background: #17191C; color: #F4F5F2; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
    </button>
  </div>

  <div style="margin: 0 16px; flex-grow: 1; min-height: 0; border-radius: 28px; overflow: hidden; position: relative; background: #15171A">
    <svg width="100%" height="100%" viewBox="40 90 380 470" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Map around your current location">
      <rect x="-200" y="0" width="860" height="700" fill="#15171A"></rect>
      <path d="M 40 380 L 170 330 L 200 470 L 60 520 Z" fill="#18261C"></path>
      <path d="M -10 120 C 80 150, 160 90, 250 130 S 380 200, 470 170" stroke="#152634" stroke-width="28" fill="none"></path>
      <path d="M 0 330 L 460 300 M 0 460 L 460 440 M 60 0 L 90 600 M 240 0 L 255 600 M 370 0 L 400 600 M 0 560 L 460 540" stroke="#23272C" stroke-width="3" fill="none"></path>
      <path d="M 0 250 L 460 210 M 130 0 L 190 600 M 300 0 L 330 600" stroke="#2C3137" stroke-width="7" fill="none"></path>
      <circle cx="230" cy="318" r="30" fill="{{accent}}" fill-opacity="0.14"></circle>
      <circle cx="230" cy="318" r="9" fill="{{accent}}" stroke="#0E0F11" stroke-width="3"></circle>
    </svg>
    <div style="position: absolute; top: 14px; left: 14px; display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: #0E0F11; font-size: 13px; font-weight: 500">
      <span style="width: 8px; height: 8px; border-radius: 999px; background: {{accent}}"></span>
      <span>GPS ready · ±4 m</span>
    </div>
    <button aria-label="Recenter map" style="position: absolute; right: 14px; bottom: 14px; width: 48px; height: 48px; border-radius: 16px; border: none; background: #0E0F11; color: #F4F5F2; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="7"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg>
    </button>
  </div>

  <div style="padding: 32px 0 28px; display: flex; flex-direction: column; align-items: center; gap: 16px">
    <a href="Run.dc.html" aria-label="Start run" style="width: 136px; height: 136px; border-radius: 999px; background: {{accent}}; color: #0E0F11; display: flex; align-items: center; justify-content: center; text-decoration: none; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: 0.08em">START</a>
    <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #9BA1A6">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
      <span>Live stats on lock screen · On</span>
    </div>
  </div>

  <nav aria-label="Main" style="height: 80px; flex-shrink: 0; background: #141619; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center">
    <a href="Main.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #F4F5F2; font-size: 12px; font-weight: 600">
      <span style="width: 64px; height: 32px; border-radius: 999px; background: {{accentSoft}}; color: {{accent}}; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="14" cy="4" r="2"></circle><path d="M7 21l3-6 3 2v5M10 15l1-5 4 3 3 1M11 10l-3 1-2 3"></path></svg>
      </span>
      Run
    </a>
    <a href="Summary.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #9BA1A6; font-size: 12px; font-weight: 500">
      <span style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5M12 7v5l3 2"></path></svg>
      </span>
      History
    </a>
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #9BA1A6; font-size: 12px; font-weight: 500">
      <span style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
      </span>
      Profile
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8F031","options":["#C8F031","#4FD1FF","#FF8A3D"]},"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#C8F031';
    return { accent: accent, accentSoft: accent + '29' };
  }
}
</script>
</body>
</html>
