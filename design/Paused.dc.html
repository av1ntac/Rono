<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rono – run paused</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
a{color:#C8F031}a:hover{color:#E2FF7A}
</style>
</helmet>
<div style="width: 412px; height: 915px; box-sizing: border-box; background: #0E0F11; color: #F4F5F2; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <div style="padding: 24px 20px 0; display: flex; justify-content: space-between; align-items: center">
    <div style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 999px; background: #FF9F43; color: #0E0F11; font-size: 14px; font-weight: 700">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="4.5" width="4" height="15" rx="1.2"></rect><rect x="14" y="4.5" width="4" height="15" rx="1.2"></rect></svg>
      Paused · 0:42
    </div>
    <div style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #9BA1A6">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"></path><circle cx="12" cy="9" r="2.5"></circle></svg>
      GPS strong
    </div>
  </div>

  <div style="padding: 40px 20px 0; display: flex; flex-direction: column; align-items: center; gap: 2px">
    <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #FF9F43">Time · stopped</span>
    <span style="font-family: 'Space Grotesk', sans-serif; font-size: 100px; font-weight: 600; line-height: 1; letter-spacing: -0.03em; color: #C9CDD1">27:48</span>
    <span style="margin-top: 10px; font-family: 'Space Grotesk', sans-serif; font-size: 52px; font-weight: 500; line-height: 1; color: #C9CDD1">5.24<span style="font-size: 22px; color: #9BA1A6"> km</span></span>
  </div>

  <div style="margin: 24px 16px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <div style="padding: 14px 16px; border-radius: 22px; background: #17191C; display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 13px; color: #9BA1A6">Current pace</span>
      <span style="font-family: 'Space Grotesk', sans-serif; font-size: 34px; font-weight: 600; line-height: 1.1; color: #9BA1A6">–:––<span style="font-size: 15px; font-weight: 500"> /km</span></span>
      <span style="font-size: 12px; color: #C9CDD1">Not moving</span>
    </div>
    <div style="padding: 14px 16px; border-radius: 22px; background: #17191C; display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 13px; color: #9BA1A6">Avg pace</span>
      <span style="font-family: 'Space Grotesk', sans-serif; font-size: 34px; font-weight: 600; line-height: 1.1">5:18<span style="font-size: 15px; color: #9BA1A6; font-weight: 500"> /km</span></span>
      <span style="font-size: 12px; color: #C9CDD1">Pauses not counted</span>
    </div>
  </div>

  <div role="img" aria-label="Map of your route, showing where you paused" style="margin: 10px 16px 0; height: 290px; border-radius: 22px; overflow: hidden; position: relative; background: #15171A">
    <svg width="380" height="290" viewBox="40 130 380 400" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <rect x="-300" y="0" width="1100" height="600" fill="#15171A"></rect>
      <path d="M 40 380 L 170 330 L 200 470 L 60 520 Z" fill="#18261C"></path>
      <path d="M -300 350 L 760 280 M -300 473 L 760 427 M 60 0 L 90 600 M 240 0 L 255 600 M 370 0 L 400 600 M -60 0 L -40 600 M 500 0 L 520 600" stroke="#23272C" stroke-width="3" fill="none"></path>
      <path d="M -300 276 L 760 184 M 130 0 L 190 600 M 300 0 L 330 600" stroke="#2C3137" stroke-width="7" fill="none"></path>
      <path d="M 95 500 C 120 450, 110 400, 150 360 S 230 320, 240 260 S 260 170, 310 150 S 370 190, 345 250 S 300 330, 330 380" stroke="#0E0F11" stroke-width="10" fill="none" stroke-linecap="round"></path>
      <path d="M 95 500 C 120 450, 110 400, 150 360 S 230 320, 240 260 S 260 170, 310 150 S 370 190, 345 250 S 300 330, 330 380" stroke="{{accent}}" stroke-width="5" stroke-opacity="0.55" fill="none" stroke-linecap="round"></path>
      <circle cx="95" cy="500" r="7" fill="#F4F5F2" stroke="#0E0F11" stroke-width="3"></circle>
      <circle cx="330" cy="380" r="9" fill="#FF9F43" stroke="#0E0F11" stroke-width="3"></circle>
    </svg>
    <span style="position: absolute; left: 12px; bottom: 12px; padding: 6px 12px; border-radius: 999px; background: #0E0F11; color: #F4F5F2; font-size: 12px; font-weight: 500">Paused here</span>
  </div>

  <div style="margin-top: auto; padding: 0 28px 34px; display: flex; justify-content: center; align-items: flex-start; gap: 48px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
      <a href="Run.dc.html" aria-label="Resume run" style="width: 104px; height: 104px; border-radius: 999px; background: {{accent}}; color: #0E0F11; display: flex; align-items: center; justify-content: center; text-decoration: none">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 4.8v14.4a1 1 0 0 0 1.5.9l11.2-7.2a1 1 0 0 0 0-1.8L9.5 3.9A1 1 0 0 0 8 4.8z"></path></svg>
      </a>
      <span style="font-size: 12px; color: #9BA1A6">Resume</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding-top: 20px">
      <a href="Summary.dc.html" aria-label="Finish run (press and hold)" style="width: 64px; height: 64px; border-radius: 999px; background: #202327; color: #F4F5F2; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2.5"></rect></svg>
      </a>
      <span style="font-size: 12px; color: #9BA1A6">Hold to finish</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8F031","options":["#C8F031","#4FD1FF","#FF8A3D"]},"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#C8F031' };
  }
}
</script>
</body>
</html>
