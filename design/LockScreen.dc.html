<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lock screen – live run notification</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
a{color:#C8F031}a:hover{color:#E2FF7A}
</style>
</helmet>
<div style="width: 412px; height: 915px; box-sizing: border-box; background: #0A0B0D; color: #F4F5F2; font-family: Inter, system-ui, sans-serif; position: relative; overflow: hidden; display: flex; flex-direction: column">

  <svg width="412" height="915" viewBox="0 0 412 915" style="position: absolute; inset: 0" aria-hidden="true">
    <g fill="none" stroke="#16191D" stroke-width="2">
      <path d="M -20 620 C 80 560, 160 640, 260 590 S 400 520, 440 560"></path>
      <path d="M -20 660 C 80 600, 170 690, 270 635 S 400 570, 440 610"></path>
      <path d="M -20 700 C 90 645, 180 735, 280 680 S 400 620, 440 660"></path>
      <path d="M -20 740 C 90 690, 190 780, 290 725 S 400 670, 440 710"></path>
      <path d="M -20 780 C 100 735, 200 825, 300 770 S 400 720, 440 760"></path>
      <path d="M -20 820 C 100 780, 210 870, 310 815 S 400 770, 440 810"></path>
    </g>
  </svg>

  <div style="position: relative; padding-top: 72px; display: flex; flex-direction: column; align-items: center; gap: 6px">
    <span style="font-family: 'Space Grotesk', sans-serif; font-size: 112px; font-weight: 300; line-height: 1; letter-spacing: -0.04em">18:52</span>
    <span style="font-size: 16px; color: #C9CDD1">Wed, 18 Nov</span>
  </div>

  <div style="position: relative; margin: 36px 12px 0; padding: 16px 18px 14px; border-radius: 28px; background: #1C1F23; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="width: 28px; height: 28px; border-radius: 999px; background: {{accent}}; color: #0E0F11; display: flex; align-items: center; justify-content: center">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="14" cy="4" r="2"></circle><path d="M7 21l3-6 3 2v5M10 15l1-5 4 3 3 1M11 10l-3 1-2 3"></path></svg>
      </span>
      <span style="font-size: 13px; font-weight: 600">Rono</span>
      <span style="font-size: 13px; color: #9BA1A6">· Free run</span>
      <span style="margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: {{accent}}">
        <span style="width: 7px; height: 7px; border-radius: 999px; background: {{accent}}"></span>Live
      </span>
    </div>

    <div style="display: flex; align-items: flex-end; justify-content: space-between">
      <div style="display: flex; flex-direction: column">
        <span style="font-size: 12px; color: #9BA1A6">Time</span>
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 52px; font-weight: 600; line-height: 1; letter-spacing: -0.02em">27:48</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-end">
        <span style="font-size: 12px; color: #9BA1A6">Pace</span>
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 36px; font-weight: 600; line-height: 1; color: {{accent}}">5:06<span style="font-size: 14px; color: #9BA1A6; font-weight: 500"> /km</span></span>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding-top: 12px; border-top: 1px solid #2B2F34">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 12px; color: #9BA1A6">Distance</span>
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 600">5.24 km</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 12px; color: #9BA1A6">Avg pace</span>
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 600">5:18</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="height: 6px; border-radius: 999px; background: #2B2F34; overflow: hidden">
        <div style="width: 24%; height: 6px; border-radius: 999px; background: {{accent}}"></div>
      </div>
      <span style="font-size: 12px; color: #9BA1A6">760 m to km 6</span>
    </div>

    <div style="display: flex; flex-direction: column">
      <button style="height: 48px; border-radius: 999px; border: none; background: {{accent}}; color: #0E0F11; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="4.5" width="4" height="15" rx="1.2"></rect><rect x="14" y="4.5" width="4" height="15" rx="1.2"></rect></svg>
        Pause
      </button>
    </div>
  </div>

  <div style="position: relative; margin-top: auto; padding: 0 28px 40px; display: flex; align-items: center; justify-content: space-between">
    <button aria-label="Flashlight" style="width: 56px; height: 56px; border-radius: 999px; border: none; background: #1C1F23; color: #F4F5F2; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 2h10v5l-3 4v11h-4V11L7 7z"></path><path d="M12 14v2"></path></svg>
    </button>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; color: #C9CDD1">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
      <span style="font-size: 13px">Swipe up to open Rono</span>
    </div>
    <button aria-label="Camera" style="width: 56px; height: 56px; border-radius: 999px; border: none; background: #1C1F23; color: #F4F5F2; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h4l2-3h6l2 3h4v12H3z"></path><circle cx="12" cy="13" r="4"></circle></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8F031","options":["#C8F031","#4FD1FF","#FF8A3D"]},"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#C8F031' };
  }
}
</script>
</body>
</html>
