<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Run summary</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
a{color:#C8F031}a:hover{color:#E2FF7A}
</style>
</helmet>
<div style="width: 412px; height: 1180px; box-sizing: border-box; background: #0E0F11; color: #F4F5F2; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <div style="height: 64px; padding: 8px 8px 0; display: flex; align-items: center; gap: 4px">
    <a href="Main.dc.html" aria-label="Back" style="width: 48px; height: 48px; border-radius: 999px; color: #F4F5F2; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <h1 style="margin: 0; flex-grow: 1; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600">Evening run</h1>
    <button aria-label="Share run" style="width: 48px; height: 48px; border-radius: 999px; border: none; background: transparent; color: #F4F5F2; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"></path></svg>
    </button>
  </div>
  <p style="margin: 0 20px; font-size: 14px; color: #9BA1A6">Wed, 18 Nov · 18:24 – 18:52 · Free run</p>

  <div style="margin: 12px 16px 0; height: 260px; border-radius: 28px; overflow: hidden; position: relative; background: #15171A">
    <svg width="380" height="260" viewBox="20 240 380 420" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Full route map from start to finish with kilometre markers">
      <rect x="-200" y="0" width="800" height="915" fill="#15171A"></rect>
      <path d="M 20 560 L 170 520 L 200 720 L 40 770 Z" fill="#18261C"></path>
      <path d="M -200 500 L 600 470 M -200 600 L 600 580 M -200 250 L 600 220 M 50 0 L 80 915 M 230 0 L 250 915 M 380 0 L 400 915 M -60 0 L -40 915 M 480 0 L 500 915" stroke="#23272C" stroke-width="3" fill="none"></path>
      <path d="M -200 390 L 600 325 M 120 0 L 180 915 M 300 0 L 330 915" stroke="#2C3137" stroke-width="8" fill="none"></path>
      <path d="M 90 640 C 115 590, 100 540, 145 500 S 230 450, 240 390 S 262 290, 312 262 S 378 300, 352 380 S 300 470, 335 530" stroke="#0E0F11" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>
      <path d="M 90 640 C 115 590, 100 540, 145 500 S 230 450, 240 390 S 262 290, 312 262 S 378 300, 352 380 S 300 470, 335 530" stroke="{{accent}}" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>
      <circle cx="140" cy="505" r="11" fill="#0E0F11" stroke="{{accent}}" stroke-width="2"></circle>
      <text x="140" y="509" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#F4F5F2">1</text>
      <circle cx="239" cy="400" r="11" fill="#0E0F11" stroke="{{accent}}" stroke-width="2"></circle>
      <text x="239" y="404" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#F4F5F2">2</text>
      <circle cx="296" cy="270" r="11" fill="#0E0F11" stroke="{{accent}}" stroke-width="2"></circle>
      <text x="296" y="274" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#F4F5F2">3</text>
      <circle cx="362" cy="332" r="11" fill="#0E0F11" stroke="{{accent}}" stroke-width="2"></circle>
      <text x="362" y="336" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#F4F5F2">4</text>
      <circle cx="318" cy="476" r="11" fill="#0E0F11" stroke="{{accent}}" stroke-width="2"></circle>
      <text x="318" y="480" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#F4F5F2">5</text>
      <circle cx="90" cy="640" r="9" fill="#F4F5F2" stroke="#0E0F11" stroke-width="3"></circle>
      <rect x="326" y="521" width="18" height="18" rx="4" fill="{{accent}}" stroke="#0E0F11" stroke-width="3"></rect>
    </svg>
    <div style="position: absolute; left: 12px; bottom: 12px; display: flex; gap: 12px; padding: 6px 12px; border-radius: 999px; background: #0E0F11; font-size: 12px; color: #C9CDD1">
      <span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 999px; background: #F4F5F2"></span>Start</span>
      <span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: {{accent}}"></span>Finish</span>
    </div>
  </div>

  <div style="margin: 12px 16px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
    <div style="display: flex; flex-direction: column; gap: 2px; padding: 4px">
      <span style="font-size: 12px; color: #9BA1A6">Distance</span>
      <span style="font-family: 'Space Grotesk', sans-serif; font-size: 34px; font-weight: 600; line-height: 1.1">5.24<span style="font-size: 15px; color: #9BA1A6; font-weight: 500"> km</span></span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px; padding: 4px">
      <span style="font-size: 12px; color: #9BA1A6">Time</span>
      <span style="font-family: 'Space Grotesk', sans-serif; font-size: 34px; font-weight: 600; line-height: 1.1">27:48</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px; padding: 4px">
      <span style="font-size: 12px; color: #9BA1A6">Avg pace</span>
      <span style="font-family: 'Space Grotesk', sans-serif; font-size: 34px; font-weight: 600; line-height: 1.1; color: {{accent}}">5:18<span style="font-size: 15px; color: #9BA1A6; font-weight: 500"> /km</span></span>
    </div>
  </div>

  <div style="margin: 10px 16px 0; padding: 14px 18px; border-radius: 20px; background: #17191C; display: flex; justify-content: space-between; align-items: center">
    <span style="font-size: 14px; color: #9BA1A6">Fastest km</span>
    <span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600">5:04<span style="font-size: 14px; color: #9BA1A6; font-weight: 500"> /km · km 5</span></span>
  </div>

  <div style="margin: 12px 16px 0; padding: 16px; border-radius: 24px; background: #17191C; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <h2 style="margin: 0; font-size: 15px; font-weight: 600">Pace per 100 m</h2>
      <span style="font-size: 12px; color: #9BA1A6">52 splits · taller = faster</span>
    </div>
    <div role="img" aria-label="Bar chart of all 52 splits of 100 metres. Pace was steady around 33 seconds early and sped up to under 30 seconds in the last kilometre." style="position: relative; height: 180px; display: flex; align-items: flex-end; gap: 2px">
      <sc-for list="{{bars}}" as="b" hint-placeholder-count="52">
        <div style="flex-grow: 1; flex-basis: 0; height: {{b.h}}px; background: {{b.color}}; border-radius: 2px 2px 1px 1px"></div>
      </sc-for>
      <div style="position: absolute; left: 0; right: 0; bottom: {{avgLine}}px; border-top: 2px dashed #F4F5F2"></div>
      <span style="position: absolute; left: 0; top: 0; padding: 2px 8px; border-radius: 999px; background: #0E0F11; font-size: 11px; font-weight: 600">dashed = avg 0:31.8</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); font-size: 12px; color: #9BA1A6">
      <span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5 km</span>
    </div>
  </div>

  <div style="margin: 12px 16px 0; padding: 16px; border-radius: 24px; background: #17191C; display: flex; flex-direction: column; gap: 4px">
    <h2 style="margin: 0 0 8px; font-size: 15px; font-weight: 600">Kilometre splits</h2>
    <sc-for list="{{kms}}" as="k" hint-placeholder-count="6">
      <div style="display: grid; grid-template-columns: 56px 60px minmax(0, 1fr); gap: 12px; align-items: center; height: 40px">
        <span style="font-size: 14px; color: #9BA1A6">{{k.label}}</span>
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 600">{{k.pace}}</span>
        <div style="height: 10px; border-radius: 999px; background: #26292E; overflow: hidden">
          <div style="height: 10px; width: {{k.w}}%; border-radius: 999px; background: {{k.color}}"></div>
        </div>
      </div>
    </sc-for>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8F031","options":["#C8F031","#4FD1FF","#FF8A3D"]},"$preview":{"width":412,"height":1180}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#C8F031';
    const slow = '#FF9F43';
    const avg = 31.8;
    const splits = [
      33.6,33.2,32.9,33.4,32.8,33.1,32.7,33.0,32.6,32.7,
      32.9,32.4,32.8,32.5,32.6,32.3,32.7,32.6,32.5,32.7,
      32.3,32.0,32.4,31.9,32.1,31.8,32.2,31.8,32.4,31.9,
      32.1,31.6,31.8,31.5,31.9,31.2,31.4,31.0,31.6,31.3,
      30.9,31.2,31.5,30.8,31.0,30.4,30.1,29.6,29.2,28.9,
      29.4,30.6
    ];
    const height = (x) => Math.round(20 + (34 - x) * 30);
    const bars = splits.map((x) => ({ h: height(x), color: x <= avg ? accent : slow }));
    const kmData = [
      { label: 'km 1', s: 330 }, { label: 'km 2', s: 326 }, { label: 'km 3', s: 321 },
      { label: 'km 4', s: 315 }, { label: 'km 5', s: 304 }, { label: '0.24 km', s: 301 }
    ];
    const fmt = (s) => Math.floor(s / 60) + ':' + ((s % 60) < 10 ? '0' : '') + (s % 60);
    const kms = kmData.map((k) => ({
      label: k.label,
      pace: fmt(k.s),
      w: Math.round(40 + (335 - k.s) * 1.8),
      color: k.s <= 318 ? accent : slow
    }));
    return { accent: accent, bars: bars, avgLine: height(avg), kms: kms };
  }
}
</script>
</body>
</html>
